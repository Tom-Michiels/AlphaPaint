# AlphaPaint Daemon Configuration

serial:
  baud_rate: 115200
  timeout: 1.0
  reconnect_delay: 5.0

machine:
  pen_z_default: 0.5        # Default pen contact Z (mm) - height where pen touches paper
  jog_feedrate: 10000       # Jog speed (mm/min)
  draw_feedrate: 3000       # Drawing speed (mm/min)
  pen_lift_feedrate: 10000  # Pen Z movement speed (mm/min)
  # Machine position right after homing (FluidNC homing mpos_mm). Homing is
  # rejected if FluidNC does not report this position afterwards.
  home_position: {X: 0.0, Y: 0.0, Z: 60.0}
  # X position where Y is re-homed during programs (rehome_y). Must be free of
  # obstacles along Y down to the Y switch - the full homing uses X=0.
  rehome_safe_x: 600.0
  # Note: Safe Z height is dynamically read from machine_limits['Z'][1]

# Override FluidNC axis limits at every daemon start (sent via $ commands).
# Uncomment entries to override; otherwise the controller's own values are used
# (X/Y: 10000 mm/min, 500 mm/sec²; Z: 3000 mm/min, 500 mm/sec²).
#motion_limits:
#  x_max_rate: 6000          # $110 mm/min
#  y_max_rate: 6000          # $111 mm/min
#  x_acceleration: 250       # $120 mm/sec²
#  y_acceleration: 250       # $121 mm/sec²

drawing:
  ellipse_segments: 36      # Number of segments for ellipse approximation
  min_position_delta: 0.01  # Minimum position change to send jog (mm)

logging:
  level: INFO               # DEBUG, INFO, WARNING, ERROR
  file: /var/log/alphapaint-daemon.log
  max_size: 10485760        # 10 MB
  backup_count: 5

debugging:
  enable_console_echo: false  # Echo Console messages to log
  enable_fluidnc_echo: false  # Echo FluidNC messages to log
  # Position tracer: writes one CSV row per status sample (~10 Hz) plus
  # event rows for state changes, soft resets, etc. Comment out to disable
  # CSV output (event-level WARNINGs in the main log stay enabled either way).
  # Analyze afterwards with tools/analyze_position_trace.py.
  position_trace_file: /var/log/alphapaint-position-trace.csv

# HTTP API for software that takes over control completely (see
# lib/remote_api.py). While it is in control the console only shows the
# position; its buttons do nothing, except a long press on A as an abort.
# Binding to anything other than 127.0.0.1 lets the whole network move the
# machine, so set a token as well if you do.
remote_api:
  enabled: true
  host: 127.0.0.1
  port: 8080
  token: ""
  abort_button: true

# Pen changer geometry, used by the API's pickup/return (the client library
# Programs/alphapaint.py has the same numbers for console-driven programs).
toolchanger:
  slots: 5
  first_x: 700.0
  spacing: 34.0
  y: 12.0
  z: 13.0
  y_safe: 55.0
  approach_feedrate: 1000

# USB camera on the gantry. 'auto' picks the first USB video device.
camera:
  device: auto
  photo_dir: /var/log/alphapaint-photos

# External drawing programs configuration
# These programs are triggered by buttons E, F, G when enabled.
# Programs communicate via stdin/stdout JSON protocol.
external_programs:
  button_e:
    enabled: true            # Set to true to use external program instead of line drawing
    name: "Logo Robot"         # Human-readable name for logging
    command: "/home/tom/AlphaPaint/Software/Programs/logo_runner.py"               # Path to executable (e.g., /home/pi/programs/spiral.py)
    args: ["/home/tom/AlphaPaint/Examples/ROBOT.logo"]                  # Command line arguments
    timeout: 300              # Maximum runtime in seconds (0 = unlimited)

  button_f:
    enabled: true
    name: "Pentest"         # Human-readable name for logging
    command: "/home/tom/AlphaPaint/Software/Programs/pentest.py"
    args: []
    timeout: 0

  button_g:
    enabled: true             # Button G only works with external programs
    name: "Ekster"
    command: "/home/tom/AlphaPaint/Software/Programs/ekster.py"
    args: []
    timeout: 0                # Onbeperkt - tekening kan lang duren
